version: '3.8'

services:
  ctb-dashboard:
    image: node:22-alpine
    container_name: ctb-borneo-dashboard
    restart: unless-stopped
    ports:
      - "7677:7677"
    environment:
      - PORT=7677
      - NODE_ENV=production
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - SESSION_SECRET=borneo-super-secret-key-2026
    volumes:
      - ./data:/app/data
      - .:/app
    working_dir: /app
    command: sh -c "npm install && npm run build && npx tsx server.ts"
